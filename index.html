<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Graceful Celestial - Textile Vectorizer</title>

    <link rel="stylesheet" href="style.css">

    <!-- ImageTracer -->
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
</head>

<body>

    <header>
        <div class="logo">
            Graceful Celestial
        </div>

        <p>Textile & Batik Vectorizer</p>
    </header>


    <main>

        <section class="hero">

            <h1>
                Photo to Textile Vector
            </h1>

            <p>
                Turn your Batik and Textile photos into clean vector artwork.
            </p>

        </section>


        <!-- Upload -->

        <section class="upload-box">

            <h2>1. Upload your image</h2>

            <label for="imageInput" class="upload-button">
                📷 Choose Image
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/png,image/jpeg,image/jpg"
            >

            <p id="fileName">
                No image selected
            </p>

        </section>


        <!-- Settings -->

        <section class="settings">

            <h2>2. Vector Settings</h2>

            <div class="setting">

                <label>
                    Threshold
                </label>

                <input
                    type="range"
                    id="threshold"
                    min="20"
                    max="240"
                    value="128"
                >

                <span id="thresholdValue">
                    128
                </span>

            </div>


            <div class="setting">

                <label>
                    Detail
                </label>

                <input
                    type="range"
                    id="detail"
                    min="0"
                    max="10"
                    value="5"
                >

                <span id="detailValue">
                    5
                </span>

            </div>


            <button id="vectorButton">
                ✨ Create Vector
            </button>

        </section>


        <!-- Preview -->

        <section class="preview">

            <div class="preview-card">

                <h2>Original</h2>

                <div class="image-container">
                    <img id="originalImage">
                </div>

            </div>


            <div class="preview-card">

                <h2>Vector</h2>

                <div
                    class="image-container vector-container"
                    id="vectorPreview"
                >
                    <p>
                        Your vector will appear here
                    </p>
                </div>

            </div>

        </section>


        <!-- Download -->

        <section class="download-box">

            <h2>3. Download</h2>

            <button
                id="downloadSVG"
                disabled
            >
                Download SVG
            </button>


            <button
                id="downloadEPS"
                disabled
            >
                Download EPS
            </button>

        </section>


    </main>


    <footer>

        <p>
            © 2026 Graceful Celestial
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
